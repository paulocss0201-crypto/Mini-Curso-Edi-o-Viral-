<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Área de membros do minicurso Edição Viral em Minutos.">
  <title>Edição Viral em Minutos | Hype Content</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f5f5f5'/%3E%3Cpath d='M19 18h8v10h10V18h8v28h-8V36H27v10h-8z' fill='%23080808'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#080808;--surface:#111;--text:#f5f5f5;--muted:rgba(255,255,255,.42);--border:rgba(255,255,255,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}
    header{position:sticky;top:0;z-index:20;height:74px;border-bottom:1px solid var(--border);background:rgba(8,8,8,.9);backdrop-filter:blur(18px)}
    .topbar{height:100%;max-width:1380px;margin:auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#fff;color:#000;font-weight:900}.brand-title{font-size:14px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.brand-sub{margin-top:4px;font-size:11px;color:rgba(255,255,255,.35)}
    .top-progress{display:flex;align-items:center;gap:12px;font-size:12px}.track{width:112px;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:.3s}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);max-width:1380px;margin:auto}.sidebar{min-height:calc(100vh - 74px);padding:36px 28px;border-right:1px solid var(--border)}
    .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.15em;text-transform:uppercase}.course-title{margin:0;font-size:27px;line-height:1.08;letter-spacing:-.04em}.progress-row{display:flex;justify-content:space-between;margin-top:24px;font-size:12px}.muted{color:var(--muted)}.sidebar .track{width:100%;height:4px;margin-top:12px}.lesson-list{margin-top:34px;padding-top:24px;border-top:1px solid var(--border)}.section-label{margin:0 0 12px;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.14em;text-transform:uppercase}.lesson-button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:8px;border:1px solid transparent;border-radius:16px;background:transparent;color:#fff;text-align:left;transition:.2s}.lesson-button:hover{background:rgba(255,255,255,.03)}.lesson-button.active{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.07)}.lesson-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.055);color:rgba(255,255,255,.58)}.lesson-button.done .lesson-icon{background:#fff;color:#000}.lesson-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}.lesson-meta{display:block;margin-top:5px;font-size:11px;color:rgba(255,255,255,.3)}
    .content{min-width:0;padding:44px 64px}.inner{max-width:920px;margin:auto}.crumb{display:flex;align-items:center;gap:9px;margin-bottom:24px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.35)}.crumb i{display:block;width:20px;height:1px;background:rgba(255,255,255,.15)}h1{max-width:800px;margin:0;font-size:clamp(32px,5vw,56px);line-height:1.02;letter-spacing:-.045em}.description{max-width:700px;margin:16px 0 0;font-size:16px;line-height:1.75;color:rgba(255,255,255,.47)}.player{margin-top:32px;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:#111;box-shadow:0 30px 90px rgba(0,0,0,.45)}video{display:block;width:100%;height:100%;background:#000;object-fit:contain}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}.complete,.nav-btn{min-height:48px;border-radius:99px}.complete{padding:0 24px;border:0;background:#fff;color:#000;font-size:14px;font-weight:700}.complete.done{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff}.navs{display:flex;gap:8px}.nav-btn{padding:0 20px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#fff}.nav-btn:disabled{opacity:.25;cursor:not-allowed}.learning{margin-top:48px;padding-top:32px;border-top:1px solid var(--border)}.learning h2{margin:0 0 20px;font-size:18px}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.topic{min-height:142px;padding:20px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.025)}.topic-num{display:grid;place-items:center;width:32px;height:32px;margin-bottom:28px;border-radius:8px;background:rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.4)}.topic p{margin:0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.72)}.mobile-menu{display:none}.drawer{display:none}
    @media(max-width:900px){.topbar{padding:0 20px}.top-progress{display:none}.layout{display:block}.sidebar{display:none}.content{padding:32px 20px}.mobile-menu{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:transparent;color:#fff}.drawer.open{display:block;position:fixed;inset:74px 0 0;z-index:30;background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}.drawer-panel{width:min(88vw,360px);height:100%;padding:28px 22px;background:#0d0d0d;border-right:1px solid var(--border)}.actions{align-items:stretch;flex-direction:column}.navs{display:grid;grid-template-columns:1fr 2fr}.topics{grid-template-columns:1fr}.topic{min-height:0}.lesson-name{white-space:normal}.player{border-radius:14px}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="brand"><span class="logo">H</span><div><div class="brand-title">Hype Content</div><div class="brand-sub">Área de membros</div></div></div><div class="top-progress"><span class="muted">Seu progresso</span><div class="track"><div class="fill js-fill"></div></div><b class="js-percent">0%</b></div><button class="mobile-menu" aria-label="Abrir aulas" onclick="toggleMenu(true)">☰</button></div></header>
  <div class="drawer" id="drawer" onclick="toggleMenu(false)"><div class="drawer-panel" onclick="event.stopPropagation()"><div id="mobile-sidebar"></div></div></div>
  <main class="layout"><aside class="sidebar"><div id="desktop-sidebar"></div></aside><section class="content"><div class="inner"><div class="crumb"><span>Mini curso</span><i></i><span id="crumb-aula"></span></div><h1 id="title"></h1><p class="description" id="description"></p><div class="player"><video id="video" controls preload="metadata" playsinline></video></div><div class="actions"><button class="complete" id="complete" onclick="toggleComplete()">✓ Marcar como concluída</button><div class="navs"><button class="nav-btn" id="previous" onclick="changeLesson(active-1)">← Anterior</button><button class="nav-btn" id="next" onclick="changeLesson(active+1)">Próxima aula →</button></div></div><div class="learning"><h2>O que você vai aprender</h2><div class="topics" id="topics"></div></div></div></section></main>
  <script>
    const lessons=[
      {number:'01',title:'CapCut do Zero: Sua Primeira Edição',duration:'19:19',video:'videos/aula-01-capcut-do-zero.mp4',description:'Domine o essencial do CapCut pelo celular e construa sua primeira edição completa, mesmo começando do absoluto zero.',topics:['Conhecendo as ferramentas essenciais','Cortes, textos e elementos visuais','Montando um vídeo completo no celular']},
      {number:'02',title:'O Código da Edição Perfeita',duration:'08:39',video:'videos/aula-02-edicao-perfeita.mp4',description:'Descubra os ajustes e detalhes que fazem uma edição simples ganhar ritmo, clareza e aparência profissional.',topics:['Segredos para uma edição mais fluida','Ritmo visual que prende atenção','Acabamentos que elevam a qualidade']},
      {number:'03',title:'Edição Turbo: IA do CapCut na Prática',duration:'07:46',video:'videos/aula-03-ia-capcut.mp4',description:'Use os novos recursos de inteligência artificial do CapCut para editar mais rápido e criar vídeos impactantes em segundos.',topics:['Recursos de IA que economizam tempo','Criação acelerada de vídeos','Como usar automação sem perder qualidade']}
    ];
    let active=0;let completed=JSON.parse(localStorage.getItem('hype-edicao-progress')||'[]');
    function sidebar(){const percent=Math.round(completed.length/lessons.length*100);return `<div class="eyebrow">✣ <span>Mini curso</span></div><h2 class="course-title">Edição Viral<br>em Minutos</h2><div class="progress-row"><span class="muted">${completed.length} de ${lessons.length} aulas</span><b>${percent}%</b></div><div class="track"><div class="fill" style="width:${percent}%"></div></div><div class="lesson-list"><p class="section-label">Aulas</p>${lessons.map((l,i)=>`<button class="lesson-button ${active===i?'active':''} ${completed.includes(i)?'done':''}" onclick="changeLesson(${i})"><span class="lesson-icon">${completed.includes(i)?'✓':'▷'}</span><span><span class="lesson-name">${l.title}</span><span class="lesson-meta">Aula ${l.number} · ${l.duration}</span></span></button>`).join('')}</div>`}
    function render(){const l=lessons[active];document.getElementById('desktop-sidebar').innerHTML=sidebar();document.getElementById('mobile-sidebar').innerHTML=sidebar();document.getElementById('crumb-aula').textContent=`Aula ${l.number}`;document.getElementById('title').textContent=l.title;document.getElementById('description').textContent=l.description;const video=document.getElementById('video');if(video.getAttribute('src')!==l.video){video.src=l.video;video.load()}document.getElementById('topics').innerHTML=l.topics.map((t,i)=>`<div class="topic"><span class="topic-num">0${i+1}</span><p>${t}</p></div>`).join('');const done=completed.includes(active);const button=document.getElementById('complete');button.classList.toggle('done',done);button.textContent=done?'✓ Aula concluída':'✓ Marcar como concluída';document.getElementById('previous').disabled=active===0;document.getElementById('next').disabled=active===lessons.length-1;const percent=Math.round(completed.length/lessons.length*100);document.querySelectorAll('.js-fill').forEach(e=>e.style.width=percent+'%');document.querySelectorAll('.js-percent').forEach(e=>e.textContent=percent+'%')}
    function changeLesson(i){if(i<0||i>=lessons.length)return;active=i;toggleMenu(false);render();scrollTo({top:0,behavior:'smooth'})}
    function toggleComplete(){completed=completed.includes(active)?completed.filter(i=>i!==active):[...completed,active];localStorage.setItem('hype-edicao-progress',JSON.stringify(completed));render()}
    function toggleMenu(open){document.getElementById('drawer').classList.toggle('open',open)}
    render();
  </script>
</body>
</html>
