<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Área de membros do minicurso Edição Viral em Minutos.">
  <title>Edição Viral em Minutos | Hype Content</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='white'/%3E%3Cpath d='M19 18h8v10h10V18h8v28h-8V36H27v10h-8z' fill='%23080808'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#080808;--surface:#111;--text:#f5f5f5;--muted:#777;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}
    header{position:sticky;top:0;z-index:20;height:74px;border-bottom:1px solid var(--line);background:rgba(8,8,8,.92);backdrop-filter:blur(18px)}
    .topbar{height:100%;max-width:1380px;margin:auto;padding:0 38px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:#fff;color:#000;font-weight:900}.brand strong{display:block;font-size:14px;letter-spacing:.13em;text-transform:uppercase}.brand small{display:block;margin-top:4px;color:#666}.progress-top{display:flex;align-items:center;gap:12px;font-size:12px}.track{height:5px;background:#202020;border-radius:20px;overflow:hidden}.track>span{display:block;width:0;height:100%;background:#fff;transition:.25s}.progress-top .track{width:112px}
    .layout{max-width:1380px;margin:auto;display:grid;grid-template-columns:340px minmax(0,1fr)}aside{min-height:calc(100vh - 74px);padding:38px 28px;border-right:1px solid var(--line)}.eyebrow{margin-bottom:16px;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#666}.course-title{margin:0;font-size:27px;line-height:1.08;letter-spacing:-.04em}.progress-info{display:flex;justify-content:space-between;margin:25px 0 11px;font-size:12px;color:#777}.side-track{width:100%}.lessons{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}.lessons-label{margin:0 0 12px;color:#555;font-size:11px;letter-spacing:.14em;text-transform:uppercase}.lesson{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px;border:1px solid transparent;border-radius:16px;background:transparent;color:#fff;text-align:left;transition:.2s}.lesson:hover{background:#101010}.lesson.active{border-color:#303030;background:#171717}.lesson.done .lesson-icon{background:#fff;color:#000}.lesson-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;background:#1a1a1a;color:#888}.lesson-title{display:block;font-size:14px;font-weight:600;line-height:1.3}.lesson-meta{display:block;margin-top:5px;color:#555;font-size:11px}
    .content{min-width:0;padding:45px 64px}.inner{max-width:920px;margin:auto}.crumb{display:flex;align-items:center;gap:9px;margin-bottom:25px;color:#666;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.crumb i{width:20px;height:1px;background:#333}h1{max-width:820px;margin:0;font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-.045em}.description{max-width:720px;margin:16px 0 0;color:#777;font-size:16px;line-height:1.7}.player{margin-top:32px;aspect-ratio:16/9;overflow:hidden;border:1px solid #292929;border-radius:20px;background:#111;box-shadow:0 30px 90px rgba(0,0,0,.45)}iframe{display:block;width:100%;height:100%;border:0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.complete,.nav{min-height:48px;border-radius:50px}.complete{padding:0 24px;border:0;background:#fff;color:#000;font-weight:700}.complete.done{border:1px solid #333;background:#131313;color:#fff}.nav-wrap{display:flex;gap:8px}.nav{padding:0 20px;border:1px solid #292929;background:transparent;color:#fff}.nav:disabled{opacity:.25;cursor:not-allowed}.learning{margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}.learning h2{margin:0 0 20px;font-size:18px}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.topic{padding:20px;min-height:145px;border:1px solid var(--line);border-radius:16px;background:#0d0d0d}.num{display:grid;place-items:center;width:32px;height:32px;margin-bottom:28px;border-radius:8px;background:#191919;color:#666;font-size:12px}.topic p{margin:0;color:#aaa;font-size:14px;line-height:1.6}.menu,.drawer{display:none}
    @media(max-width:900px){.topbar{padding:0 20px}.progress-top{display:none}.layout{display:block}aside{display:none}.content{padding:32px 20px}.menu{display:grid;place-items:center;width:40px;height:40px;border:1px solid #292929;border-radius:50%;background:transparent;color:#fff}.drawer.open{display:block;position:fixed;inset:74px 0 0;z-index:30;background:rgba(0,0,0,.72);backdrop-filter:blur(7px)}.drawer-panel{width:min(88vw,360px);height:100%;overflow:auto;padding:28px 22px;background:#0d0d0d;border-right:1px solid var(--line)}.actions{flex-direction:column}.nav-wrap{display:grid;grid-template-columns:1fr 1.6fr}.topics{grid-template-columns:1fr}.topic{min-height:0}.player{border-radius:14px}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="brand"><span class="logo">H</span><div><strong>Hype Content</strong><small>Área de membros</small></div></div><div class="progress-top"><span style="color:#777">Seu progresso</span><div class="track"><span class="fill"></span></div><b class="percent">0%</b></div><button class="menu" onclick="menu(true)" aria-label="Abrir aulas">☰</button></div></header>
  <div class="drawer" id="drawer" onclick="menu(false)"><div class="drawer-panel" onclick="event.stopPropagation()" id="mobileSide"></div></div>
  <main class="layout"><aside id="desktopSide"></aside><section class="content"><div class="inner"><div class="crumb"><span>Mini curso</span><i></i><span id="crumb"></span></div><h1 id="title"></h1><p class="description" id="description"></p><div class="player" id="player"></div><div class="actions"><button class="complete" id="complete" onclick="toggleComplete()">✓ Marcar como concluída</button><div class="nav-wrap"><button class="nav" id="prev" onclick="change(active-1)">← Anterior</button><button class="nav" id="next" onclick="change(active+1)">Próxima aula →</button></div></div><div class="learning"><h2>O que você vai aprender</h2><div class="topics" id="topics"></div></div></div></section></main>
  <script>
    const lessons=[
      {n:'01',id:'J6zbJwlw23o',title:'CapCut do Zero: Do Básico ao Avançado',desc:'Aprenda a editar no CapCut do básico ao avançado e construa vídeos mais profissionais pelo celular.',topics:['Fundamentos essenciais do CapCut','Cortes, efeitos e legendas','Fluxo completo de edição']},
      {n:'02',id:'rRDXYcDsgFg',title:'Edição Viral: O Estilo que Domina as Redes',desc:'Domine um dos estilos de edição mais virais e transforme gravações simples em vídeos que prendem atenção.',topics:['Estrutura visual de vídeos virais','Ritmo, movimento e retenção','Construção do efeito no celular']},
      {n:'03',id:'W_L9JHezxqw',title:'Qualidade Máxima no CapCut Mobile',desc:'Aumente a qualidade dos seus vídeos no celular e consiga uma imagem muito mais limpa antes de publicar.',topics:['Ajustes que melhoram a imagem','Nitidez e qualidade no CapCut','Configuração para exportação']},
      {n:'04',id:'oDZtkyNzESU',title:'7 Efeitos Secretos de Edição Profissional',desc:'Aprenda sete efeitos secretos para deixar suas edições mais profissionais, dinâmicas e envolventes.',topics:['Efeitos visuais profissionais','Aplicação prática no CapCut','Como usar efeitos sem exagerar']}
    ];
    let active=0;let completed=[];try{completed=JSON.parse(localStorage.getItem('hype-edicao-progress')||'[]')}catch(e){}
    function side(){const pct=Math.round(completed.length/lessons.length*100);return `<div class="eyebrow">✣ &nbsp; Mini curso</div><h2 class="course-title">Edição Viral<br>em Minutos</h2><div class="progress-info"><span>${completed.length} de ${lessons.length} aulas</span><b>${pct}%</b></div><div class="track side-track"><span style="width:${pct}%"></span></div><div class="lessons"><p class="lessons-label">Aulas</p>${lessons.map((l,i)=>`<button class="lesson ${active===i?'active':''} ${completed.includes(i)?'done':''}" onclick="change(${i})"><span class="lesson-icon">${completed.includes(i)?'✓':'▷'}</span><span><span class="lesson-title">${l.title}</span><span class="lesson-meta">Aula ${l.n} · YouTube</span></span></button>`).join('')}</div>`}
    function render(){const l=lessons[active];desktopSide.innerHTML=side();mobileSide.innerHTML=side();crumb.textContent='Aula '+l.n;title.textContent=l.title;description.textContent=l.desc;player.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${l.id}?rel=0&modestbranding=1" title="${l.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;topics.innerHTML=l.topics.map((t,i)=>`<div class="topic"><span class="num">0${i+1}</span><p>${t}</p></div>`).join('');const done=completed.includes(active);complete.classList.toggle('done',done);complete.textContent=done?'✓ Aula concluída':'✓ Marcar como concluída';prev.disabled=active===0;next.disabled=active===lessons.length-1;const pct=Math.round(completed.length/lessons.length*100);document.querySelectorAll('.fill').forEach(el=>el.style.width=pct+'%');document.querySelectorAll('.percent').forEach(el=>el.textContent=pct+'%')}
    function change(i){if(i<0||i>=lessons.length)return;active=i;menu(false);render();scrollTo({top:0,behavior:'smooth'})}
    function toggleComplete(){completed=completed.includes(active)?completed.filter(i=>i!==active):[...completed,active];localStorage.setItem('hype-edicao-progress',JSON.stringify(completed));render()}
    function menu(open){drawer.classList.toggle('open',open)}render();
  </script>
</body>
</html>
